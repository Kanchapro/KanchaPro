  <!-- MODAL: GENERADOR DE FLYERS / HISTORIAS (ESTILO ÉLITE / TV) -->
  <div id="flyerModalContainer" class="fixed inset-0 bg-black/95 flex items-center justify-center z-50 hidden p-3 overflow-y-auto backdrop-blur-xl">
    <div class="glass-card p-5 rounded-3xl max-w-sm w-full space-y-4 border border-emerald-500/40 my-auto text-xs shadow-2xl">
      <div class="flex justify-between items-center border-b border-emerald-900/50 pb-3">
        <h3 class="text-xs sm:text-sm font-black text-emerald-400 uppercase tracking-wider">Flyer Élite para Redes</h3>
        <button onclick="closeModal('flyerModalContainer')" class="text-slate-400 hover:text-white font-bold text-sm px-2 py-1 bg-emerald-950/40 rounded-lg">✕</button>
      </div>

      <!-- ÁREA DE CAPTURA VERTICAL ESTILO HISTORIA (9:16) - DISEÑO IMPACTANTE -->
      <div id="flyerCaptureArea" class="w-[320px] h-[568px] mx-auto rounded-3xl p-5 flex flex-col justify-between relative overflow-hidden shadow-2xl text-white font-sans border-2 border-emerald-500/60" style="background: linear-gradient(180deg, rgba(3,7,4,0.92) 0%, rgba(2,15,8,0.95) 50%, rgba(1,5,2,0.98) 100%), url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=600&auto=format&fit=crop') center/cover;">
        
        <!-- Efecto de luces de estadio superpuestas -->
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_30%,rgba(16,185,129,0.25)_0%,transparent_70%)] pointer-events-none"></div>

        <!-- Header del Flyer -->
        <div class="relative z-10 flex justify-between items-center border-b border-emerald-500/30 pb-3">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-8 h-8 rounded-full border border-emerald-400 bg-emerald-950 flex items-center justify-center overflow-hidden shadow-[0_0_10px_#10b981]">
              <img id="flyerCatLogo" src="https://raw.githubusercontent.com/Kanchapro/KanchaPro/main/icon.png" class="w-full h-full object-cover" onerror="this.src=FALLBACK_LOGO" />
            </div>
            <span id="flyerCatName" class="text-[10px] font-black uppercase tracking-widest text-emerald-300 truncate">KanchaPro Tournaments</span>
          </div>
          <span id="flyerBadgeState" class="text-[9px] font-black bg-emerald-500 text-black px-3 py-1 rounded-full uppercase tracking-widest shadow-[0_0_15px_#10b981] shrink-0">PRÓXIMO PARTIDO</span>
        </div>

        <!-- Contenido Central: Escudos Gigantes y Enfrentamiento -->
        <div class="relative z-10 my-auto flex flex-col items-center space-y-4 text-center">
          <span id="flyerRoundName" class="text-[11px] font-black text-emerald-400 uppercase tracking-widest bg-emerald-950/80 px-4 py-1.5 rounded-xl border border-emerald-500/40 shadow-lg">Fecha 1</span>
          
          <div class="grid grid-cols-3 items-center w-full gap-1 my-2">
            <!-- Local (Escudo Gigante) -->
            <div class="flex flex-col items-center space-y-2.5">
              <div class="w-24 h-24 rounded-3xl bg-gradient-to-b from-emerald-950/90 to-black border-2 border-emerald-400/80 flex items-center justify-center p-3 shadow-[0_0_30px_rgba(16,185,129,0.4)] backdrop-blur-md transform hover:scale-105 transition">
                <img id="flyerHomeLogo" src="" class="w-full h-full object-contain drop-shadow-[0_8px_8px_rgba(0,0,0,0.8)]" onerror="this.src=FALLBACK_LOGO" />
              </div>
              <span id="flyerHomeName" class="text-xs font-black uppercase tracking-tight text-white leading-tight line-clamp-2 drop-shadow-md">Equipo Local</span>
            </div>

            <!-- VS / Marcador Central Destacado -->
            <div class="flex flex-col items-center justify-center">
              <div id="flyerScoreBox" class="bg-black/90 border-2 border-emerald-400 px-3.5 py-2.5 rounded-2xl shadow-[0_0_25px_rgba(16,185,129,0.5)] backdrop-blur-xl">
                <span id="flyerScoreText" class="text-xl sm:text-2xl font-black text-emerald-300 tracking-wider">VS</span>
              </div>
            </div>

            <!-- Visitante (Escudo Gigante) -->
            <div class="flex flex-col items-center space-y-2.5">
              <div class="w-24 h-24 rounded-3xl bg-gradient-to-b from-emerald-950/90 to-black border-2 border-emerald-400/80 flex items-center justify-center p-3 shadow-[0_0_30px_rgba(16,185,129,0.4)] backdrop-blur-md transform hover:scale-105 transition">
                <img id="flyerAwayLogo" src="" class="w-full h-full object-contain drop-shadow-[0_8px_8px_rgba(0,0,0,0.8)]" onerror="this.src=FALLBACK_LOGO" />
              </div>
              <span id="flyerAwayName" class="text-xs font-black uppercase tracking-tight text-white leading-tight line-clamp-2 drop-shadow-md">Equipo Visitante</span>
            </div>
          </div>

          <!-- Incidencias / Goleadores si finalizó -->
          <div id="flyerStatsContainer" class="w-full bg-black/85 backdrop-blur-md rounded-2xl p-3 border border-emerald-500/40 text-[10px] space-y-1 hidden text-left shadow-xl">
            <div class="text-[9px] text-emerald-400 font-black uppercase tracking-wider mb-1 flex items-center gap-1"><span>⚽</span> Goleadores del Partido</div>
            <div id="flyerGoalsList" class="text-slate-200 font-medium space-y-0.5"></div>
          </div>
        </div>

        <!-- Footer del Flyer -->
        <div class="relative z-10 space-y-2.5 pt-3 border-t border-emerald-500/30">
          <div id="flyerInfoBox" class="flex flex-col items-center justify-center text-center text-[10px] text-slate-100 font-bold space-y-0.5 bg-emerald-950/60 p-2.5 rounded-xl border border-emerald-500/30 shadow-inner">
            <span id="flyerDateTime">🗓️ Sábado 15:30 Hs</span>
            <span id="flyerVenue">🏟️ Cancha Oficial</span>
          </div>
          
          <div class="flex justify-between items-center text-[9px] font-black text-slate-300 uppercase tracking-widest px-1">
            <span class="text-emerald-400">KANCHAPRO.APP</span>
            <span>#VivíElFútbol</span>
          </div>
        </div>

      </div>

      <!-- Botón Descargar / Compartir Flyer -->
      <div class="pt-2">
        <button onclick="downloadFlyerImage()" class="w-full bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-300 hover:to-green-400 text-black font-black py-3 rounded-xl transition shadow-xl text-xs flex items-center justify-center gap-2">
          <span>📸 Descargar o Compartir Historia</span>
        </button>
      </div>
    </div>
  </div>
