<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas de Visitas — KanchaPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;750;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #060907; color: #f0fdf4; }
    .glass-card { background: rgba(11, 20, 14, 0.92); backdrop-filter: blur(16px); border: 1px solid rgba(34, 197, 94, 0.18); }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 max-w-4xl mx-auto space-y-6">

  <header class="flex justify-between items-center border-b border-green-900/40 pb-4">
    <h1 class="text-lg font-black text-green-400">📊 Estadísticas de Tráfico — KanchaPro</h1>
    <a href="admin.html" class="text-xs bg-emerald-600/20 text-emerald-300 px-3 py-1.5 rounded-xl border border-emerald-500/30 font-bold hover:bg-emerald-600/30 transition">← Volver al Admin</a>
  </header>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <!-- Tarjeta Index -->
    <div class="glass-card p-5 rounded-2xl space-y-2 border border-green-500/30">
      <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Portal Público (Index)</span>
      <div id="indexVisitsCount" class="text-3xl font-black text-green-400">Cargando...</div>
      <p class="text-[11px] text-slate-500">Total de visitas registradas en la página principal.</p>
    </div>

    <!-- Tarjeta Admin -->
    <div class="glass-card p-5 rounded-2xl space-y-2 border border-blue-500/30">
      <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Panel de Administración (Admin)</span>
      <div id="adminVisitsCount" class="text-3xl font-black text-blue-400">Cargando...</div>
      <p class="text-[11px] text-slate-500">Total de accesos al panel de gestión.</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vjwiqdlmgjvuychmyiix.supabase.co";
    const SUPABASE_ANON_KEY = "TU_ANON_KEY_AQUI"; // Tu clave de supabase actual
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.addEventListener('DOMContentLoaded', async () => {
      await loadStats();
    });

    async function loadStats() {
      try {
        // Consultar visitas del index
        const { count: indexCount, error: errIndex } = await supabaseClient
          .from('visitor_stats')
          .select('*', { count: 'exact', head: true })
          .eq('page_type', 'index');

        // Consultar visitas del admin
        const { count: adminCount, error: errAdmin } = await supabaseClient
          .from('visitor_stats')
          .select('*', { count: 'exact', head: true })
          .eq('page_type', 'admin');

        document.getElementById('indexVisitsCount').textContent = indexCount || 0;
        document.getElementById('adminVisitsCount').textContent = adminCount || 0;
      } catch (err) {
        console.error("Error al cargar estadísticas:", err);
      }
    }
  </script>
</body>
</html>
