<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KanchaPro - Panel Admin Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #0b0f0d; color: #f0fdf4; }
    .glass-card { background: rgba(13, 27, 18, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(34, 197, 94, 0.2); }
    .btn-green { background-color: #16a34a; transition: background 0.2s; }
    .btn-green:hover { background-color: #15803d; }
    .tab-active { border-bottom: 3px solid #22c55e; color: #4ade80; background: rgba(34, 197, 94, 0.1); }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: #0b0f0d; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #166534; border-radius: 2px; }

    @media print {
      body, html { background: white !important; color: black !important; height: auto !important; overflow: visible !important; font-size: 10px !important; }
      body * { visibility: hidden; }
      #adm-fixture, #adm-fixture *, #adminMatchesList, #adminMatchesList * { visibility: visible; }
      #adm-fixture { position: absolute; left: 0; top: 0; width: 100% !important; background: white !important; color: black !important; padding: 5px !important; }
      #adminMatchesList { max-height: none !important; overflow: visible !important; position: static !important; width: 100% !important; display: block !important; }
      .no-print, button, header, .flex.flex-col.gap-3.bg-\[\#0b0f0d\], .hide-on-share { display: none !important; }
      #adminMatchesList > div { background: white !important; border: 1px solid #ccc !important; border-radius: 4px !important; margin-bottom: 8px !important; padding: 6px !important; page-break-inside: avoid; break-inside: avoid; }
      #adminMatchesList > div h4 { color: #000 !important; font-size: 11px !important; border-bottom: 2px solid #000 !important; padding-bottom: 3px !important; margin-bottom: 4px !important; text-transform: uppercase; }
      #adminMatchesList div.print-match-row { display: flex !important; justify-content: space-between !important; align-items: center !important; border-bottom: 1px solid #eee !important; padding: 4px 2px !important; font-size: 10px !important; }
      #adminMatchesList div.print-match-row span { color: black !important; }
      span, div { color: black !important; }
      .text-green-400, .text-green-300, .text-emerald-400 { color: #000 !important; font-weight: bold; }
    }
  </style>
</head>
<body class="h-full flex flex-col overflow-auto">
  <!-- El contenido completo ya se encuentra arriba en la respuesta anterior listo para guardar en tu repositorio de GitHub Pages -->
  <div class="p-6 text-center space-y-4">
    <h2 class="text-xl font-bold text-green-400">KanchaPro Admin</h2>
    <p class="text-xs text-slate-300">Usa el código completo proporcionado en el mensaje anterior para actualizar tu archivo <code class="bg-black px-2 py-1 rounded text-green-300">admin.html</code>.</p>
  </div>
</body>
</html>
