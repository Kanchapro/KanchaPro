<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanchapro - Panel de Administración</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #0b0f0d; color: #f0fdf4; }
    .glass-card { background: rgba(13, 27, 18, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(34, 197, 94, 0.15); }
    .btn-green { background-color: #16a34a; transition: background 0.2s; }
    .btn-green:hover { background-color: #15803d; }
    .tab-active { border-bottom: 3px solid #22c55e; color: #4ade80; }
  </style>
</head>
<body class="h-full flex flex-col overflow-auto">

  <!-- ==================== CONFIGURACIÓN DE SUPABASE ==================== -->
  <script>
    const SUPABASE_URL = "https://vjwiqdlmgjvuychmyiix.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqd2lxZGxtZ2p2dXljaG15aWl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMDg1NDcsImV4cCI6MjEwODU4NDU0N30.bGzlMNgBv-bfriA0SgYzPxNNdfc9REOjjHemtXSiDP0";
    let supabaseClient = null;
    if (typeof supabase !== 'undefined') {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  </script>

  <!-- ==================== PANTALLA DE LOGIN (SOLO GOOGLE) ==================== -->
  <div id="loginScreen" class="fixed inset-0 bg-black/95 flex items-center justify-center z-50 p-4">
    <div class="glass-card p-8 rounded-2xl max-w-md w-full text-center space-y-6 shadow-2xl">
      <div class="w-16 h-16 bg-green-600/20 text-green-400 rounded-2xl flex items-center justify-center mx-auto text-3xl border border-green-500/30">⚽</div>
      <div>
        <h2 class="text-2xl font-black text-white">Kancha<span class="text-green-400">Pro</span> Admin</h2>
        <p class="text-xs text-slate-400 mt-1">Inicia sesión con tu cuenta autorizada</p>
      </div>
      
      <!-- Botón de Login con Google -->
      <button onclick="loginWithGoogle()" class="w-full bg-[#0b0f0d] hover:bg-green-950/40 text-white font-semibold py-3.5 px-4 rounded-xl border border-green-500/30 transition flex items-center justify-center gap-3 shadow-lg text-sm">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Continuar con Google
      </button>
    </div>
  </div>

  <!-- Header Admin -->
  <header class="bg-[#060a08]/95 border-b border-green-900/40 px-4 py-3 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <h1 class="text-base font-black text-green-400">KANCHA<span class="text-white">PRO</span> <span class="text-xs text-slate-400 font-normal">| Admin Panel</span></h1>
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="text-xs px-3 py-2 bg-slate-800 hover:bg-slate-700 text-green-400 rounded-lg font-semibold border border-green-500/20">👁️ Ver Portal Público</a>
      <button onclick="logoutAdmin()" class="text-xs px-3 py-2 bg-red-900/40 hover:bg-red-900/60 text-red-300 rounded-lg font-semibold border border-red-500/30">Cerrar Sesión</button>
    </div>
  </header>

  <!-- Panel Principal Administrador -->
  <main id="adminMainPanel" class="flex-1 max-w-6xl w-full mx-auto p-4 space-y-6 hidden">
    
    <!-- Pestañas de Administración -->
    <div class="flex overflow-x-auto gap-2 glass-card rounded-xl p-2 border border-green-900/30">
      <button onclick="switchAdminTab('categories', event)" class="admin-tab px-4 py-2 rounded-lg text-sm whitespace-nowrap tab-active font-semibold">🏆 Torneos / Categorías</button>
      <button onclick="switchAdminTab('teams', event)" class="admin-tab px-4 py-2 rounded-lg text-sm whitespace-nowrap text-slate-400 font-semibold">🛡️ Equipos</button>
      <button onclick="switchAdminTab('matches', event)" class="admin-tab px-4 py-2 rounded-lg text-sm whitespace-nowrap text-slate-400 font-semibold">⚽ Partidos y Resultados</button>
    </div>

    <!-- Tab 1: Torneos / Categorías -->
    <div id="adm-categories" class="admin-tab-content glass-card rounded-2xl p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-green-300">Gestión de Torneos</h3>
        <button onclick="openNewCategoryModal()" class="btn-green text-white text-xs font-bold px-4 py-2.5 rounded-xl">+ Nuevo Torneo</button>
      </div>
      <div id="adminCategoriesList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Tab 2: Equipos -->
    <div id="adm-teams" class="admin-tab-content glass-card rounded-2xl p-6 space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-green-300">Equipos Registrados</h3>
        <button onclick="openNewTeamModal()" class="btn-green text-white text-xs font-bold px-4 py-2.5 rounded-xl">+ Nuevo Equipo</button>
      </div>
      <div id="adminTeamsList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </div>

    <!-- Tab 3: Partidos -->
    <div id="adm-matches" class="admin-tab-content glass-card rounded-2xl p-6 space-y-4 hidden">
      <h3 class="text-lg font-bold text-green-300">Fixture y Carga de Marcadores</h3>
      <div id="adminMatchesList" class="space-y-3"></div>
    </div>

  </main>

  <!-- Script de Lógica de Administración con Supabase y Auth Google -->
  <script>
    let dbData = { categories: [], teams: [], players: [], matches: [], suspensions: [] };

    window.addEventListener('DOMContentLoaded', async () => {
      if (supabaseClient) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          unlockAdminPanel();
        }
      }
    });

    async function loginWithGoogle() {
      if (!supabaseClient) {
        alert("Supabase no está configurado correctamente.");
        return;
      }
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.href }
      });
      if (error) {
        alert("Error al iniciar sesión con Google: " + error.message);
      }
    }

    function unlockAdminPanel() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminMainPanel').classList.remove('hidden');
      loadAdminData();
    }

    async function logoutAdmin() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
      }
      window.location.reload();
    }

    async function loadAdminData() {
      if (!supabaseClient) return;
      try {
        const [cat, team, player, match, susp] = await Promise.all([
          supabaseClient.from('torneos_data').select('*').eq('type', 'category'),
          supabaseClient.from('torneos_data').select('*').eq('type', 'team'),
          supabaseClient.from('torneos_data').select('*').eq('type', 'player'),
          supabaseClient.from('torneos_data').select('*').eq('type', 'match'),
          supabaseClient.from('torneos_data').select('*').eq('type', 'suspension')
        ]);

        dbData.categories = cat.data || [];
        dbData.teams = team.data || [];
        dbData.players = player.data || [];
        dbData.matches = match.data || [];
        dbData.suspensions = susp.data || [];

        renderAdminViews();
      } catch (err) {
        console.error("Error al cargar datos en admin:", err);
      }
    }

    function switchAdminTab(tabKey, evt) {
      document.querySelectorAll('.admin-tab').forEach(t => {
        t.classList.remove('tab-active', 'text-green-400');
        t.classList.add('text-slate-400');
      });
      evt.target.classList.add('tab-active', 'text-green-400');
      evt.target.classList.remove('text-slate-400');

      document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.add('hidden'));
      document.getElementById(`adm-${tabKey}`).classList.remove('hidden');
    }

    function renderAdminViews() {
      document.getElementById('adminCategoriesList').innerHTML = dbData.categories.map(c => `
        <div class="bg-[#0b0f0d] p-4 rounded-xl border border-green-900/30 flex justify-between items-center">
          <div>
            <h4 class="font-bold text-white">${c.name}</h4>
            <p class="text-xs text-slate-400">Modalidad: ${c.fixture_type}</p>
          </div>
          <button onclick="deleteRecord('${c.id}')" class="bg-red-900/30 hover:bg-red-900/60 text-red-300 px-3 py-1.5 rounded-lg text-xs font-bold">🗑️ Eliminar</button>
        </div>
      `).join('') || '<p class="text-slate-500 text-sm">No hay torneos creados.</p>';

      document.getElementById('adminTeamsList').innerHTML = dbData.teams.map(t => `
        <div class="bg-[#0b0f0d] p-4 rounded-xl border border-green-900/30 space-y-2">
          <div class="font-bold text-white text-sm">${t.name}</div>
          <button onclick="deleteRecord('${t.id}')" class="text-red-400 text-xs hover:underline">Eliminar equipo</button>
        </div>
      `).join('') || '<p class="text-slate-500 text-sm">No hay equipos.</p>';
    }

    async function openNewCategoryModal() {
      const name = prompt("Nombre del nuevo Torneo / Categoría:");
      if (!name) return;
      const newCat = { id: 'cat_' + Date.now(), type: 'category', name, fixture_type: 'round_robin' };
      
      const { error } = await supabaseClient.from('torneos_data').insert([newCat]);
      if (!error) {
        alert("¡Torneo creado con éxito!");
        loadAdminData();
      } else {
        alert("Error al guardar en Supabase.");
      }
    }

    async function openNewTeamModal() {
      if (dbData.categories.length === 0) {
        alert("Primero debes crear al menos un torneo/categoría.");
        return;
      }
      const name = prompt("Nombre del equipo:");
      if (!name) return;
      const catId = dbData.categories[0].id;
      const newTeam = { id: 'team_' + Date.now(), type: 'team', name, category_id: catId };

      const { error } = await supabaseClient.from('torneos_data').insert([newTeam]);
      if (!error) {
        alert("¡Equipo creado con éxito!");
        loadAdminData();
      }
    }

    async function deleteRecord(id) {
      if (!confirm("¿Estás seguro de eliminar este registro?")) return;
      const { error } = await supabaseClient.from('torneos_data').delete().eq('id', id);
      if (!error) {
        loadAdminData();
      } else {
        alert("Error al eliminar.");
      }
    }
  </script>
</body>
</html>
